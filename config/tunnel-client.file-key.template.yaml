# Non-secret file reference only. Does not create, read, or upload the key.
# Requires separate approved owner input and runtime/network authorization.
config_version: 1
control_plane:
  base_url: https://api.openai.com
  tunnel_id: REPLACE_WITH_YOUR_TUNNEL_ID
  api_key: file:/ABSOLUTE/PRIVATE_DIRECTORY/tunnel/runtime-api-key
mcp:
  server_urls:
    - channel: main
      url: http://127.0.0.1:3000/mcp
log:
  level: info
  format: json
health:
  listen_addr: 127.0.0.1:0
admin_ui:
  open_browser: false
